# TLS 终结 + 静态/上传直出 + 反代（生产实测配置，与 <ECS_IP> 上 /etc/nginx/conf.d/nexus.conf 一致）
# 证书路径与域名来自部署配置，代码侧不硬编码任何路径。

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # 外挂证书：从证书库同步到 /etc/nexus/certs/，不写进仓库
    ssl_certificate     /etc/nexus/certs/fullchain.pem;
    ssl_certificate_key /etc/nexus/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # 静态由 nginx 直出，Rust 进程不参与
    location /static/ {
        alias /opt/nexus/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 用户上传的图片（DESIGN §32）。文件名是内容哈希，所以可以长缓存；
    # 走 nginx 直出同样是为了不让 Rust 进程参与几 MB 的二进制传输。
    location /uploads/ {
        alias /opt/nexus/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
