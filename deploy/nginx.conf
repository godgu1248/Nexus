# TLS 终结 + 静态/上传直出 + 反代（生产实测配置，与 <ECS_IP> 上 /etc/nginx/conf.d/nexus.conf 一致）
# 证书路径与域名来自部署配置，代码侧不硬编码任何路径。

# 压缩：这一层以前完全没有，HTML/CSS/JS 都按原样传。
# 实测 /static/app.css 37,620 B、htmx.min.js 51,076 B，开 gzip 后各降到 6–16 KB。
# gzip_types 必须显式列出——nginx 默认只压 text/html，CSS/JS/JSON 都在默认清单之外。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # 外挂证书：从证书库同步到 /etc/nexus/certs/，不写进仓库
    ssl_certificate     /etc/nexus/certs/fullchain.pem;
    ssl_certificate_key /etc/nexus/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 注意：nginx 的 add_header 只在"当前层级没有 add_header"时才继承上层。
    # 所以下面每个自己加了 add_header 的 location 都必须把这三行重复一遍，
    # 否则 /static/ 与 /uploads/ 会悄悄丢掉 X-Frame-Options 与 Referrer-Policy。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传上限必须 ≥ 应用侧的限制：/media/upload 允许 4 MiB 图片 + 64 KiB 表单余量
    # （DESIGN §32）。原来是 2m，于是 2–4 MB 的图片在这里就被 nginx 用自带的 413 页
    # 挡掉了——界面写着"≤4 MB"，用户却永远传不上去。
    client_max_body_size 5m;

    # 静态由 nginx 直出，Rust 进程不参与
    location /static/ {
        alias /opt/nexus/static/;
        access_log off;
        # 只留一条 Cache-Control：以前 expires 30d 与 add_header 同时生效，
        # 响应里出现两个互相矛盾的 max-age（2592000 与 31536000）。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 用户上传的图片（DESIGN §32）。文件名是内容哈希，所以可以长缓存；
    # 走 nginx 直出同样是为了不让 Rust 进程参与几 MB 的二进制传输。
    location /uploads/ {
        alias /opt/nexus/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 发行包镜像（DESIGN §34.6）：GitHub 到国内链路不稳时的备用下载点。
    # 目录内容与 Release 资产是同一份字节，校验和文件也在里面。
    location /downloads/ {
        alias /opt/nexus/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 只让 nginx 决定客户端地址：X-Real-IP 是覆盖写；X-Forwarded-For 用
        # $proxy_add_x_forwarded_for 会把客户端自带的头保留在最左（应用取末段）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # 动态页面不进浏览器缓存：否则退出登录后按"后退"还能看到上一个账号的页面内容。
        # htmx 片段同理——红点该不该亮，每次都要读数据库说了算。
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
