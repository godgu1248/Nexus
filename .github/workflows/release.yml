name: release

# 打 tag 即发版：从 tag 构建 Linux(musl) 与 Windows 二进制，连同源码包一起发布到 Release。
# 用仓库内置的 GITHUB_TOKEN，不需要任何个人访问令牌。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（已存在，例如 v0.1.2）'
        required: true

permissions:
  contents: write

# 同一个 tag 只允许一个发布在跑；重打/移动 tag 时直接取消前一次。
#
# 为什么必须要有：v0.1.11 打 tag 时我先把 tag 指错了 commit，删除重建又推了一次，
# 于是两个 run 同时在往同一个 Release 上传。`--clobber` 让后到的覆盖先到的，
# 但两个 run 各自的 SHA256SUMS.txt 只描述自己那一份——结果发布页上出现
# `nexus-0.1.11-linux-x86_64.zip` 与它的校验和**不匹配**（另外三个是好的），
# 也就是"校验和证明不了任何东西"。并发控制是根治点。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: 构建（静态链接）
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: 校验静态链接
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/nexus
          file "$BIN"
          # musl 静态二进制在 glibc 主机上 `ldd` 只说 "statically linked"，
          # 用程序头里有没有 PT_INTERP 判定更可靠（有 = 动态加载器依赖）。
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "::error::binary still has PT_INTERP (dynamic loader)"
            exit 1
          fi
          echo "static ok: no PT_INTERP"
      - name: 打包
        run: |
          set -eu
          V="${{ needs.version.outputs.version }}"
          D="nexus-$V-linux-x86_64"
          mkdir -p "$D" dist
          cp target/x86_64-unknown-linux-musl/release/nexus "$D/nexus"
          for p in static deploy migrations README.md DESIGN.md .env.example; do cp -r "$p" "$D/"; done
          tar -czf "dist/$D.tar.gz" "$D"
          zip -qr "dist/$D.zip" "$D"
          tar -tzf "dist/$D.tar.gz" | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: 构建
        run: cargo build --release --locked
      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.version.outputs.version }}'
          $d = "nexus-$v-windows-x86_64"
          New-Item -ItemType Directory -Path $d, dist -Force | Out-Null
          Copy-Item target/release/nexus.exe "$d/nexus.exe"
          foreach ($p in @('static','deploy','migrations','README.md','DESIGN.md','.env.example')) {
            Copy-Item -Recurse $p "$d/"
          }
          # bsdtar 写正斜杠分隔符；Compress-Archive 会写反斜杠，Linux 上解出来是平铺文件
          tar.exe -a -c -f "dist/$d.zip" $d
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 源码包
        run: |
          set -eu
          V="${{ needs.version.outputs.version }}"
          git archive --format=zip --prefix="nexus-$V/" -o "assets/nexus-$V-source.zip" "HEAD"
          ls -l assets
      - name: 校验和
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 每一步都 tee 到日志；失败时把日志塞进 job summary。
          #
          # 为什么：Actions 的原始日志需要 token 才能读，而 summary 是公开可读的。
          # v0.1.12 的发布步骤红过一次，当时只能看到"发布"变红、看不到 gh 的报错，
          # 白等了一轮。把错误留在 summary 里，下一次不用再猜。
          set -u
          LOG="$(mktemp)"
          exec > >(tee -a "$LOG") 2>&1
          set -x

          fail() {
            set +x
            {
              echo "### 发布失败"
              echo '```'
              tail -n 60 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap fail ERR

          set -e
          TITLE="Nexus 枢纽 $TAG"
          if [ -f "release-notes/$TAG.title" ]; then TITLE="$(cat "release-notes/$TAG.title")"; fi
          NOTES_ARG="--generate-notes"
          if [ -f "release-notes/$TAG.md" ]; then NOTES_ARG="--notes-file release-notes/$TAG.md"; fi

          echo "assets in workspace:"; ls -l assets
          COUNT=$(ls -1 assets | wc -l)
          if [ "$COUNT" -lt 5 ]; then echo "assets 不够：$COUNT"; exit 1; fi

          # create 会连带上传资产；Release 已存在时退化成 edit + clobber 上传。
          # shellcheck disable=SC2086
          if ! gh release create "$TAG" --title "$TITLE" $NOTES_ARG assets/*; then
            echo "create 失败，改走 edit + upload"
            gh release edit "$TAG" --title "$TITLE" $NOTES_ARG || true
            gh release upload "$TAG" assets/* --clobber
          fi

          set +x
          gh release view "$TAG" --json name,tagName,assets
      - name: 校对已上传的资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          # 从"发布出来的东西"回读，而不是相信本地文件。
          #
          # v0.1.11 的教训：两个 run 并发上传同一个 Release，`--clobber` 让资产各来自不同
          # 的构建，而每个 run 的 SHA256SUMS.txt 只描述自己那份——发布页上的 zip 与它的
          # 校验和不匹配，`sha256sum -c` 必然失败，但流水线当时是绿的。
          # 这里把四个包全部下载回来按 SHA256SUMS.txt 校验，不一致就让 job 变红。
          mkdir -p verify && cd verify
          gh release download "$TAG" --pattern '*.zip' --pattern '*.tar.gz' --pattern 'SHA256SUMS.txt' --clobber
          ls -l
          sha256sum -c SHA256SUMS.txt
      - name: 回读校验
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release view "$TAG" --json name,tagName,isDraft,assets